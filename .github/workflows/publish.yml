name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Site key pública do Turnstile: o build do web precisa dela para incluir o widget.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFU_UJ3A3c51FFUA'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm deploy:check

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '87b9bb14c33d5cf43f13b7cb7d776014'
      D1_DATABASE_ID: 'd2c212f4-8d89-4f78-b72e-f0a0befa6a74'
      # Pública por natureza; sem ela o export do web sai sem o widget do Turnstile.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAFU_UJ3A3c51FFUA'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: pnpm db:migrate --remote
      - run: pnpm deploy
